<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7">
<title>爬壁机器人</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="connect-mask hidden" id="connectMask">
  <div class="connect-spinner"></div>
  <div class="connect-text">正在连接母机…</div>
</div>

<!-- 全局视图切换 (固定悬浮, 不随界面左右移动) -->
<div class="seg" id="viewSwitch" data-active="host"><span class="seg-thumb"></span><button class="seg-item active" data-view="host">母机</button><button class="seg-item" data-view="child">子机</button></div>

<!-- ==================== 母机界面 ==================== -->
<div class="app" id="viewHost">

  <main class="stage">
    <div class="camera-slot" id="cameraSlotHost"></div>

    <div class="stage-head">
      <span class="stage-title">运行状态</span>
      <button id="btnClearLog" class="text-btn">清空日志</button>
    </div>
    <div id="log" class="log"></div>
  </main>

  <aside class="panel">
    <div class="panel-head">
      <span id="connDot" class="dot dot-off"></span>
      <h1 class="panel-title">爬壁机器人</h1>
      <span id="connText" class="muted">未连接</span>
    </div>

    <div class="panel-body">

      <section class="block">
        <div class="block-title">设备地址 <span class="muted">自动发现 / 手动填写</span></div>
        <div class="host-row">
          <input id="hostInput" class="host-input" type="text" placeholder="母机 IP" autocapitalize="off" autocomplete="off" spellcheck="false" />
          <input id="camHostInput" class="host-input" type="text" placeholder="摄像头母机 IP" autocapitalize="off" autocomplete="off" spellcheck="false" />
          <input id="camChildInput" class="host-input" type="text" placeholder="摄像头子机 IP" autocapitalize="off" autocomplete="off" spellcheck="false" />
          <button id="btnApplyHost" class="text-btn">应用</button>
        </div>
      </section>

      <section class="block">
        <div class="block-title">CAN 电机 <span class="muted">RS02</span></div>
        <div id="canCard"></div>
      </section>

      <section class="block">
        <div class="block-title">步态</div>
        <div class="field">
          <label class="field-label">步距</label>
          <div class="stepper" id="stepStepper">
            <button class="step-btn" data-step-delta="-10" aria-label="减小">−</button>
            <input id="stepInput" class="step-value" type="number" inputmode="numeric" value="80" min="10" max="200" step="10" aria-label="步距毫米">
            <span class="step-unit">mm</span>
            <button class="step-btn" data-step-delta="10" aria-label="增大">+</button>
          </div>
        </div>
        <div class="btn-row">
          <button id="btnForward" class="btn btn-primary">前进</button>
          <button id="btnObstacle" class="btn btn-warn">越障</button>
          <button id="btnUTurn" class="btn btn-warn">掉头</button>
        </div>
        <div class="btn-row">
          <button id="btnStart" class="btn btn-primary">自动运行</button>
          <button id="btnStop" class="btn btn-danger">停止</button>
        </div>
      </section>

      <section class="block">
        <div class="block-title">子母协同</div>
        <div id="coopCard"></div>
      </section>

      <section class="block">
        <div class="block-title">协同控制</div>
        <div class="btn-row">
          <button id="btnCoopPad" class="btn btn-gray btn-wide">协同控制</button>
          <button id="btnAlign" class="btn btn-gray btn-wide">视觉纠偏</button>
        </div>
      </section>

      <section class="block">
        <div class="block-title">调试</div>
        <div class="btn-row">
          <button id="btnDebug" class="btn btn-gray btn-wide">调试</button>
        </div>
      </section>

      <section class="block">
        <div class="block-title">夹持器</div>
        <div class="btn-row">
          <button id="btnGripper" class="btn btn-gray btn-wide">夹持器</button>
        </div>
      </section>

    </div>
  </aside>

  <div id="toast" class="toast"></div>
</div>

<!-- ==================== 子机界面 ==================== -->
<div class="app-child" id="viewChild">

  <main class="stage-child">
    <div class="camera-slot" id="cameraSlotChild"></div>

    <div class="stage-head stage-head-dark">
      <span class="stage-title">运行状态</span>
      <button id="btnClearChildLog" class="text-btn text-btn-dark">清空日志</button>
    </div>
    <div id="childLog" class="log log-dark"></div>
  </main>

  <aside class="panel-child">
    <div class="panel-head-child">
      <h1 class="panel-title-child">子机控制</h1>
      <span id="childSendState" class="muted-dark">—</span>
    </div>

    <div class="panel-body-child">

      <section class="block-child">
        <div class="block-title-child">手柄</div>
        <div class="dpad-wrap">
          <div class="dpad" id="dpad">
            <button class="dpad-btn dpad-up"    data-dpad="up">▲</button>
            <button class="dpad-btn dpad-left"  data-dpad="left">◀</button>
            <button class="dpad-btn dpad-center" data-dpad="stop">停</button>
            <button class="dpad-btn dpad-right" data-dpad="right">▶</button>
            <button class="dpad-btn dpad-down"  data-dpad="down">▼</button>
          </div>
          <div class="joystick-axis">
            <div class="axis-row"><span class="axis-name">前后</span><span id="axisY" class="axis-val">0</span></div>
            <div class="axis-row"><span class="axis-name">转向</span><span id="axisX" class="axis-val">0</span></div>
          </div>
        </div>
      </section>

      <section class="block-child">
        <div class="block-title-child">按键</div>
        <div class="key-grid">
          <button class="key-btn" data-child-key="3">风机 +</button>
          <button class="key-btn" data-child-key="4">风机 −</button>
          <button class="key-btn" data-child-key="6">停风机</button>
          <button class="key-btn" data-child-key="1">夹持 +</button>
          <button class="key-btn" data-child-key="2">夹持 −</button>
        </div>
      </section>

      <section class="block-child">
        <div class="block-title-child">声发射监测</div>
        <div class="ae-addr">
          <span class="ae-addr-label">声发射服务</span>
          <span class="ae-addr-text">192.168.4.1:5000</span>
        </div>
        <div class="ae-status-row">
          <span id="aeStatusDot" class="ae-dot off"></span>
          <span id="aeStatusText" class="ae-status-text">未连接</span>
          <button id="btnAeRefresh" class="key-btn ae-mini">刷新</button>
        </div>
        <div class="ae-params">
          <div class="ae-param"><label>采样率</label><select id="aeSampleRate" class="ae-input ae-select"><option value="2000000" selected>2 MHz</option><option value="1000000">1 MHz</option><option value="500000">500 kHz</option></select></div>
          <div class="ae-param"><label>阈值 dB</label><input id="aeThreshold" class="ae-input ae-num" type="number" value="30"></div>
          <div class="ae-param"><label>滤波 kHz</label><input id="aeHp" class="ae-input ae-num" type="number" value="30"><span class="ae-dash">–</span><input id="aeLp" class="ae-input ae-num" type="number" value="300"></div>
          <div class="ae-param"><label>DDT µs</label><input id="aeDdt" class="ae-input ae-num" type="number" value="80"></div>
        </div>
        <div class="btn-row-child">
          <button id="btnAeStart" class="key-btn ae-start">启动采集</button>
          <button id="btnAeStop" class="key-btn ae-stop">停止采集</button>
        </div>
        <div class="ae-log" id="aeLog"></div>
        <div class="ae-files-head">
          <span class="block-title-child">数据文件</span>
          <button id="btnAeFiles" class="text-btn text-btn-dark">刷新</button>
        </div>
        <div class="ae-files" id="aeFiles"></div>
      </section>



    </div>
  </aside>

</div>

<!-- ==================== 常驻摄像头层 (不随界面切换重建, 流保持不断) ==================== -->
<div class="camera-dock" id="cameraDock">
  <div class="camera-head">
    <span class="stage-title">摄像头</span>
  </div>
  <div class="camera-duo">
    <div class="camera-cell">
      <div class="camera-cell-head"><span class="camera-cell-label">母机</span><span id="cameraBadge" class="pill off">未接入</span></div>
      <div id="cameraCard" class="camera-card"></div>
    </div>
    <div class="camera-cell">
      <div class="camera-cell-head"><span class="camera-cell-label">子机 K230</span><span id="cameraBadge2" class="pill off">未接入</span></div>
      <div id="cameraCard2" class="camera-card"></div>
    </div>
  </div>
</div>

<script src="js/native.js?v=4"></script>
<script src="js/protocol.js?v=8"></script>
<script src="js/transport.js?v=5"></script>
<script src="js/ui.js?v=4"></script>
<script src="js/modules/can.js?v=4"></script>
<script src="js/modules/gait.js?v=4"></script>
<script src="js/modules/coop.js?v=6"></script>
<script src="js/modules/debug.js?v=4"></script>
<script src="js/modules/coopPad.js?v=5"></script>
<script src="js/modules/align.js?v=11"></script>
<script src="js/modules/gripper.js?v=4"></script>
<script src="js/modules/camera.js?v=6"></script>
<script src="js/modules/joystick.js?v=4"></script>
<script src="js/modules/ae.js?v=4"></script>
<script src="js/app.js?v=9"></script>
</body>
</html>
